# Два контейнера: Nginx (статика + прокси) + FastAPI.
# Домен: http://zavodstart.ru/ — SPA по пути /commercial-offer/.
#
# Сборка: docker compose -f docker-compose.split.yml build
# Запуск:  docker compose -f docker-compose.split.yml up -d
#
# На хостинге DNS A-запись zavodstart.ru → IP сервера; публикация порта 80 на frontend.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: plan-wed-backend:split
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PB_DB_PATH: /data/pb.db
      PLITA_DB_PATH: /data/plita.db
      DRAFTS_DIR: /data/drafts
      OUTPUTS_DIR: /data/outputs
      LOGS_DIR: /data/logs
      PLANS_DIR: /data/plans
      PLANS_METADATA_PATH: /data/plans_metadata.json
      CURRENT_PLAN_PATH: /data/current_plan.json
      BACKEND_CORS_ALLOWED_ORIGINS: "http://zavodstart.ru,http://www.zavodstart.ru"
      # OPENAI_API_KEY: "..."
      # APP_SECRET_KEY: "..."
      # Прайсы: смонтируйте том и выставьте пути через env
      # PRICES_DIR: /knowledge
    volumes:
      # Данные здесь НЕ в каталоге /plan_zavod — том Docker (docker volume inspect …).
      # Варианты БД:
      # 1) Перед build положить pb.db и plita.db в docker/seed/ (попадут в образ), первый запуск скопирует в /data.
      # 2) Вместо named volume — привязка каталога на сервере (файлы видны на диске):
      #    - ./data:/data
      #    и скопируйте туда готовые pb.db и plita.db, затем up (пересборка не нужна).
      # Если том уже создал пустые БД — для повторной заливки сидов: docker compose … down -v (сотрёт /data!)
      - web_split_data:/data

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: plan-wed-frontend:split
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  web_split_data:
