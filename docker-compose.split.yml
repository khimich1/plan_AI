# Два контейнера: Nginx (HTTPS + статика + прокси) + FastAPI.
# Домен: https://zavodstart.ru/ — SPA по пути /commercial-offer/.
#
# SSL на сервере (до первого up):
#   /etc/ssl/zavodstart.ru/fullchain.pem  (сертификат + цепочка CA)
#   /etc/ssl/zavodstart.ru/privkey.pem    (приватный ключ, chmod 600)
# Файлы скачать в панели Timeweb → SSL-сертификаты.
#
# Сборка: docker compose -f docker-compose.split.yml build
# Запуск:  docker compose -f docker-compose.split.yml up -d
#
# DNS A-запись zavodstart.ru → IP VPS; порты 80 и 443 на frontend.
# На хосте не должен слушать 80/443 системный nginx/apache.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: plan-wed-backend:split
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      PB_DB_PATH: /data/pb.db
      PLITA_DB_PATH: /data/plita.db
      DRAFTS_DIR: /data/drafts
      OUTPUTS_DIR: /data/outputs
      LOGS_DIR: /data/logs
      PLANS_DIR: /data/plans
      PLANS_METADATA_PATH: /data/plans_metadata.json
      CURRENT_PLAN_PATH: /data/current_plan.json
      WORK_CALENDAR_PATH: /data/work_calendar.json
      BACKEND_CORS_ALLOWED_ORIGINS: "https://zavodstart.ru,https://www.zavodstart.ru,http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
      # GPT-4o Vision: на VPS создайте .env рядом с compose (см. .gitignore) или export OPENAI_API_KEY
      OCR_EXTERNAL_ENABLED: ${OCR_EXTERNAL_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # APP_SECRET_KEY: "..."
      # Прайсы: смонтируйте том и выставьте пути через env
      # PRICES_DIR: /knowledge
    volumes:
      # Данные здесь НЕ в каталоге /plan_zavod — том Docker (docker volume inspect …).
      # Варианты БД:
      # 1) Перед build положить pb.db в docker/seed/ (попадёт в образ). plita.db не сидится — admin через create_admin.py.
      # 2) Вместо named volume — привязка каталога на сервере (файлы видны на диске):
      #    - ./data:/data
      #    и скопируйте туда pb.db при необходимости; plita.db создастся при старте backend.
      # Если том уже создал пустые БД — для повторной заливки сидов: docker compose … down -v (сотрёт /data!)
      - web_split_data:/data

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: plan-wed-frontend:split
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/zavodstart.ru:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  web_split_data:
