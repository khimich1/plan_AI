# Nginx + SSL в контейнере frontend (zavodstart.ru).
# Сертификаты монтируются с хоста: /etc/ssl/zavodstart.ru → /etc/nginx/ssl (read-only).
# backend резолвится через Docker DNS при запросе, иначе nginx не стартует,
# пока backend ещё поднимается.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name zavodstart.ru www.zavodstart.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zavodstart.ru www.zavodstart.ru;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/app.locations.conf;
}
