# Nginx перед FastAPI для домена zavodstart.ru (HTTP).
#
# Сервис апстрима задаётте в docker-compose: имя хоста = имя контейнера backend.

upstream plan_wed_api {
    server backend:8000;
}

server {
    listen 80;
    server_name zavodstart.ru www.zavodstart.ru localhost;

    location = / {
        return 302 /commercial-offer/;
    }

    # Долго кэшируем хэшированные бандлы Vite
    location ^~ /commercial-offer/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /commercial-offer/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /commercial-offer/index.html;
    }

    location /api/ {
        proxy_pass http://plan_wed_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /web/ {
        proxy_pass http://plan_wed_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Проброс /health до FastAPI — удобно для healthcheck контейнера с фронтом
    location = /health {
        proxy_pass http://plan_wed_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
