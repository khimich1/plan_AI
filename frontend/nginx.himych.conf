# himych.ru — Let's Encrypt + прокси на chim_web (chim-nginx).
# zavodstart.ru остаётся в default.conf.
# Имя chim-nginx резолвится через Docker DNS при запросе, а не при старте nginx:
# иначе завод не поднимется, пока химия ещё не запущена.

server {
    listen 80;
    server_name himych.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://himych.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name himych.ru;

    ssl_certificate     /etc/letsencrypt/live/himych.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/himych.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $chim_edge http://chim-nginx:80;
        proxy_pass $chim_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }
}
