# Общие location для HTTPS (подключается из nginx.docker.conf).

location = / {
    return 302 /commercial-offer/;
}

location ^~ /commercial-offer/assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /commercial-offer/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /commercial-offer/index.html;
}

location /api/ {
    set $api http://backend:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    # Комплект ГСМ гоняет LibreOffice дольше дефолтных 60 с.
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /web/ {
    set $api http://backend:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /health {
    set $api http://backend:8000;
    proxy_pass $api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
