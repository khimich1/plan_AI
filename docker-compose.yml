# Локальный/серверный запуск веб-приложения.
# Сборка: docker compose build
# Запуск:  docker compose up -d
#
# Перед продакшеном создайте .env с секретами (см. комментарии ниже). Файл .env не коммитится.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: plan-wed-web:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Пути под постоянный том (базы, черновики, планы, выгрузки)
      PB_DB_PATH: /data/pb.db
      PLITA_DB_PATH: /data/plita.db
      DRAFTS_DIR: /data/drafts
      OUTPUTS_DIR: /data/outputs
      LOGS_DIR: /data/logs
      PLANS_DIR: /data/plans
      PLANS_METADATA_PATH: /data/plans_metadata.json
      CURRENT_PLAN_PATH: /data/current_plan.json
      WORK_CALENDAR_PATH: /data/work_calendar.json
      # BACKEND_CORS_ALLOWED_ORIGINS: "https://your-domain.example"
      # APP_SECRET_KEY: "..."
      # OCR / GPT Vision (значения из .env через env_file):
      # OCR_EXTERNAL_ENABLED=true
      # OPENAI_API_KEY=...
      # Прайсы и резы лежат вне образа — смонтируйте каталог и укажите пути:
      # PRICES_DIR: /knowledge
      # PRICE_XLSX_PATH: /knowledge/ваш-прайс.xlsx
      # CUTS_DOCX_PATH: /knowledge/ваш-резы.docx
    volumes:
      # Том web_data не равен каталогу проекта на хосте. Сиды: docker/seed/*.db до build
      # или bind mount ./data:/data с готовыми файлами (см. docker/seed/README.txt).
      - web_data:/data
      # Кириллица в PDF: положите .ttf в core/fonts на хосте (см. core/commercial_offer.py)
      - ./core/fonts:/app/core/fonts:ro
      # Раскомментируйте, если каталог «банк знаний» есть на хосте:
      # - ./банк знаний:/knowledge:ro
    restart: unless-stopped

volumes:
  web_data:
