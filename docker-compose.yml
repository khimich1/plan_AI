name: shishov-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - "./pb.db:/app/pb.db"
      - "./plita.db:/app/plita.db"
      - "./logs:/app/logs"
      - "./Визуализация_Раскладки:/app/Визуализация_Раскладки"
      - "./банк знаний:/app/банк знаний"
      - "./core/fonts:/app/core/fonts"
