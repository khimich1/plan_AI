# Системный Nginx на VPS: SSL на хосте, Docker только на 127.0.0.1:80.
# Установка (Ubuntu/Debian):
#   sudo cp deploy/nginx-host-ssl.conf /etc/nginx/sites-available/zavodstart.ru
#   sudo ln -sf /etc/nginx/sites-available/zavodstart.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат: положите файлы от хостинга (часто .crt + .key или fullchain + privkey).
# Пути ниже замените на те, что выдал хостинг / панель.

upstream plan_wed_docker {
    server 127.0.0.1:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name zavodstart.ru www.zavodstart.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zavodstart.ru www.zavodstart.ru;

    # Пример для сертификата от панели (подставьте свои пути):
    ssl_certificate     /etc/nginx/ssl/zavodstart.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/zavodstart.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://plan_wed_docker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
