# Nginx внутри контейнера frontend: HTTPS + редирект с HTTP.
# Сертификаты монтируются в /etc/nginx/ssl/ (см. docker-compose.split.yml).

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name zavodstart.ru www.zavodstart.ru localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zavodstart.ru www.zavodstart.ru localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = / {
        return 302 /commercial-offer/;
    }

    location ^~ /commercial-offer/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /commercial-offer/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /commercial-offer/index.html;
    }

    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /web/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $api http://backend:8000;
        proxy_pass $api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
